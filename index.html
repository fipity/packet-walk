<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>packet-walk · see how the internet works</title>
    <meta
      name="description"
      content="Free, open-source interactive lessons on Ethernet, Wi-Fi, ARP, DHCP, IPv4, IPv6, ICMP, BGP, UDP, DNS, NTP, TCP, HTTP, HTTPS/TLS 1.3, WebSocket, QUIC, SSH, FTP, SMB, SMTP, IMAP, POP3 and WireGuard, with every packet decoded byte by byte."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#070b16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the saved theme before first paint (dark by default).
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>packet-walk needs JavaScript to draw its diagrams and decode packets.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
